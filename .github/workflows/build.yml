name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para publicar el release al subir un tag vX.Y.Z

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Librerías de sistema para Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install edge-tts PySide6-Essentials tomlkit keyring
      - name: Tests (la parte de Windows se saltea; el overlay corre con Qt offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v
      - name: Demo del overlay (offscreen) y captura
        env:
          QT_QPA_PLATFORM: offscreen
          ALTR_HOME: ${{ runner.temp }}/altr-ci
        run: python -m altr --demo-overlay --screenshot "$RUNNER_TEMP/overlay-linux.png"
      - name: Ventana de Configuración (offscreen) y captura
        env:
          QT_QPA_PLATFORM: offscreen
          ALTR_HOME: ${{ runner.temp }}/altr-ci
        run: python -m altr --settings overlay --screenshot "$RUNNER_TEMP/configuracion-linux.png"
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-captura-linux-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/overlay-linux.png
            ${{ runner.temp }}/configuracion-linux.png
      - name: Sintaxis de la capa de Windows
        run: python -m py_compile altr/win.py altr/ui.py altr/app.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install . pyinstaller
      - name: Tests (incluye la capa de Windows y edge-tts real)
        env:
          ALTR_TEST_NETWORK: "1"
        run: python -m unittest discover -s tests -t . -v
      - name: Test con ventana real (Bloc de notas + Ctrl+C simulado)
        continue-on-error: true   # informativo: depende de que el runner tenga escritorio
        env:
          ALTR_TEST_GUI: "1"
        run: python -m unittest tests.test_win.WinTests.test_selection_capture_with_notepad -v
      - name: Armar AltR.exe
        run: pyinstaller --noconfirm altr.spec
      - name: Probar el .exe (config, síntesis real, arranque residente)
        shell: pwsh
        env:
          ALTR_HOME: ${{ runner.temp }}\altr-ci
          ALTR_NO_OPEN: "1"
        run: |
          $exe = Resolve-Path dist\AltR.exe
          $p = Start-Process $exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--check devolvió $($p.ExitCode)" }
          $out = Join-Path $env:RUNNER_TEMP "ci.mp3"
          $p = Start-Process $exe -ArgumentList "--say","`"Hola, esto es una prueba.`"","--out","`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path $out) -or (Get-Item $out).Length -lt 2000) { throw "--say falló" }
          # el overlay: el .exe abre la ventana con una lectura de mentira y comprueba que se crea,
          # se dibuja, pausa, salta y se cierra (sale con 0 si anduvo; el detalle queda en salida.txt)
          $shot = Join-Path $env:RUNNER_TEMP "overlay-windows.png"
          $p = Start-Process $exe -ArgumentList "--demo-overlay","--screenshot","`"$shot`"" -Wait -PassThru
          $salida = Join-Path $env:ALTR_HOME "salida.txt"
          if (Test-Path $salida) { Get-Content $salida }
          if ($p.ExitCode -ne 0) { throw "--demo-overlay devolvió $($p.ExitCode): el overlay no se creó o no funcionó" }
          if (-not (Test-Path $shot) -or (Get-Item $shot).Length -lt 3000) { throw "--demo-overlay no dejó la captura del overlay" }
          # la ventana de Configuración: igual, el .exe la abre, comprueba que el formulario refleja el config y sale
          $shotCfg = Join-Path $env:RUNNER_TEMP "configuracion-windows.png"
          $p = Start-Process $exe -ArgumentList "--settings","atajos","--screenshot","`"$shotCfg`"" -Wait -PassThru
          if (Test-Path $salida) { Get-Content $salida }
          if ($p.ExitCode -ne 0) { throw "--settings devolvió $($p.ExitCode): la ventana de configuración no cargó" }
          if (-not (Test-Path $shotCfg) -or (Get-Item $shotCfg).Length -lt 3000) { throw "--settings no dejó la captura" }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "AltR se cerró solo (código $($app.ExitCode))" }
          Get-Content (Join-Path $env:ALTR_HOME "altr.log")
          Stop-Process -Id $app.Id -Force
      - name: Probar install.ps1 como "irm | iex" (PowerShell 5.1 y 7), contra el .exe recién armado
        env:
          ALTR_NO_OPEN: "1"
          ALTR_EXE: ${{ github.workspace }}\dist\AltR.exe
        run: |
          foreach ($shell in "powershell.exe", "pwsh") {
            Write-Host "=== $shell ==="
            foreach ($mode in "iex", "scriptblock") {
              # 1) Get-Content -Raw | iex  (igual que irm | iex: el texto llega como string, sin $PSScriptRoot)
              # 2) scriptblock con parámetros
              $cmd = if ($mode -eq "iex") {
                'Get-Content -Raw -Encoding UTF8 install.ps1 | iex'
              } else {
                '& ([scriptblock]::Create((Get-Content -Raw -Encoding UTF8 install.ps1))) -Autostart'
              }
              & $shell -NoProfile -Command "`$ErrorActionPreference='Stop'; $cmd; if (Get-Command Install-AltR -ErrorAction SilentlyContinue) { throw 'quedó la función en la sesión' }; Write-Host 'sigue viva la consola'"
              if ($LASTEXITCODE -ne 0) { throw "install.ps1 ($mode) falló en $shell ($LASTEXITCODE)" }
              if (-not (Test-Path "$env:LOCALAPPDATA\AltR\AltR.exe")) { throw "no quedó AltR.exe ($mode, $shell)" }
              Start-Sleep -Seconds 3
              if (-not (Get-Process -Name AltR -ErrorAction SilentlyContinue)) { throw "AltR no quedó corriendo ($mode, $shell)" }
              if ($mode -eq "scriptblock" -and -not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run").AltR) { throw "falta la clave Run" }
              $env:ALTR_UNINSTALL = "1"
              & $shell -NoProfile -Command "Get-Content -Raw -Encoding UTF8 install.ps1 | iex"
              Remove-Item Env:\ALTR_UNINSTALL
              if ($LASTEXITCODE -ne 0) { throw "desinstalar falló en $shell" }
              if (Test-Path "$env:LOCALAPPDATA\AltR\AltR.exe") { throw "no se desinstaló ($mode, $shell)" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: overlay-captura-windows
          path: |
            ${{ runner.temp }}\overlay-windows.png
            ${{ runner.temp }}\configuracion-windows.png
      - uses: actions/upload-artifact@v4
        with:
          name: AltR-windows
          path: |
            dist/AltR.exe
            install.ps1
            altr/config.default.toml
      - name: Publicar release (sólo con tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/AltR.exe install.ps1 altr/config.default.toml --generate-notes --title "AltR ${{ github.ref_name }}"
