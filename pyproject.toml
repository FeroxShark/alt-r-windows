[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altr"
dynamic = ["version"]
description = "Lee en voz alta el texto seleccionado con un atajo global (Ctrl+Alt+R). Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "edge-tts>=7.0",
    "PySide6-Essentials>=6.6",
    "tomlkit>=0.12",
    "keyring>=24",
]

[project.scripts]
altr = "altr.cli:main"

[tool.setuptools]
packages = ["altr"]

[tool.setuptools.package-data]
altr = ["config.default.toml", "qml/*.qml", "qml/settings/*.qml", "qml/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "altr.__version__" }
